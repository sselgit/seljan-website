<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snort and Suricata tuner tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 24px; }
  .pass { color: #166534; } .fail { color: #991B1B; font-weight: bold; }
  #summary { font-size: 18px; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Snort and Suricata tuner tests</h1>
<div id="summary">Running...</div>
<pre id="out"></pre>
<script src="../site/js/kit.js"></script>
<script src="../site/js/network.js"></script>
<script src="../site/js/pcap.js"></script>
<script src="../site/js/ids-engine.js"></script>
<script src="../site/js/ids-tune.js"></script>
<script src="../site/js/pcap-build.js"></script>
<script src="../site/js/ids-data.js"></script>
<script src="../site/js/attack-map.js"></script>
<script src="../site/js/attack-ui.js"></script>
<script>
(async function () {
  var SK = window.SK, P = SK.pcap, IDS = SK.ids, PB = SK.pcapBuild;
  var lines = [], failed = 0, passed = 0;
  function log(ok, name, detail) {
    if (ok) passed++; else failed++;
    lines.push('<span class="' + (ok ? "pass" : "fail") + '">' + (ok ? "PASS " : "FAIL ") + name + (ok || !detail ? "" : "  -> " + detail) + "</span>");
  }
  function eq(name, actual, expected) { var a = JSON.stringify(actual), e = JSON.stringify(expected); log(a === e, name, "expected " + e + " got " + a); }
  function truthy(name, v, detail) { log(!!v, name, detail || String(v)); }
  var td = new TextDecoder();
  function txt(b) { return td.decode(b); }
  async function read(bytes) { return P.read(bytes); }
  async function throwsMsg(fn) { try { await fn(); return "no error"; } catch (e) { return e.userMessage || e.message; } }

  // A synthetic TCP session around raw payloads, for exercising rules without building packets.
  function S(toServer, toClient, o) {
    o = o || {};
    var enc = new TextEncoder();
    function dir(s) { var d = enc.encode(s || ""); return { data: d, segs: d.length ? [{ start: 0, len: d.length, ts: 1000, pkt: 0 }] : [], gaps: 0 }; }
    return { id: 1, proto: "tcp", ipv: 4, client: o.client || { ip: "10.0.0.5", port: 40000 }, server: o.server || { ip: "192.0.2.10", port: 80 }, start: 1000, end: 2000, packets: 4, established: o.established !== false,
      dirs: { toServer: dir(toServer), toClient: dir(toClient) }, datagrams: [] };
  }
  function fires(rule, toServer, toClient, o) {
    var parsed = IDS.parseRule(rule, (o && o.engine) || "suricata");
    return IDS.run(parsed, [S(toServer, toClient, o)], o && o.ctx).alerts.length > 0;
  }
  function R(opts, header) { return "alert " + (header || "tcp any any -> any any") + " (msg:\"t\"; " + opts + " sid:1; rev:1;)"; }

  // ================= capture formats =================
  var req = PB.http("GET", "/a?x=1", {});
  var res = PB.httpResponse(200, "hi");
  var pk = PB.tcpSession({ client: "10.0.0.5", server: "192.0.2.10", request: req, response: res });
  var cap = await read(PB.pcap(pk));
  eq("classic pcap: format and counts", [cap.format, cap.packetCount, cap.sessions.length, cap.skipped], ["pcap", pk.length, 1, 0]);
  var s0 = cap.sessions[0];
  eq("session endpoints", [s0.client.ip, s0.client.port, s0.server.ip, s0.server.port, s0.proto], ["10.0.0.5", 40000, "192.0.2.10", 80, "tcp"]);
  eq("session flags", [s0.established, s0.synSeen, s0.synAckSeen, s0.finSeen], [true, true, true, true]);
  eq("reassembled request", txt(s0.dirs.toServer.data), req);
  eq("reassembled response", txt(s0.dirs.toClient.data), res);
  eq("timestamps in milliseconds", Math.round(cap.start), 1700000000000);
  var capBe = await read(PB.pcap(pk, { big: true }));
  eq("big-endian pcap reads the same", [capBe.sessions.length, txt(capBe.sessions[0].dirs.toServer.data)], [1, req]);
  var capNano = await read(PB.pcap([{ ts: 1700000000123.456, frame: pk[0].frame }], { nano: true }));
  truthy("nanosecond pcap keeps sub-millisecond time", Math.abs(capNano.start - 1700000000123.456) < 0.01, String(capNano.start));
  var capNg = await read(PB.pcapng(pk));
  eq("pcapng reads the same", [capNg.format, capNg.sessions.length, txt(capNg.sessions[0].dirs.toServer.data)], ["pcapng", 1, req]);
  truthy("pcapng timestamps (microsecond default)", Math.abs(capNg.start - 1700000000000) < 1, String(capNg.start));
  var capNgNano = await read(PB.pcapng([{ ts: 1700000000123.456, frame: pk[0].frame }], { nano: true }));
  truthy("pcapng nanosecond resolution option", Math.abs(capNgNano.start - 1700000000123.456) < 0.01, String(capNgNano.start));
  if (typeof CompressionStream !== "undefined") {
    var gz = new Uint8Array(await new Response(new Blob([PB.pcap(pk)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
    var capGz = await read(gz);
    eq("gzip-compressed capture is read", [capGz.sessions.length, txt(capGz.sessions[0].dirs.toServer.data)], [1, req]);
  }
  eq("garbage file gives a friendly error", /does not look like a PCAP/.test(await throwsMsg(function () { return read(new Uint8Array(100).fill(7)); })), true);
  eq("tiny file gives a friendly error", /too small/.test(await throwsMsg(function () { return read(new Uint8Array(4)); })), true);
  var whole = PB.pcap(pk);
  var cut = await read(whole.subarray(0, whole.length - 7));
  truthy("truncated capture drops the last packet and warns", cut.packetCount === pk.length - 1 && cut.warnings.length === 1, JSON.stringify(cut.warnings));

  // ================= link types and IP versions =================
  ["vlan", "raw", "sll"].forEach(function (link) { });
  for (var li = 0; li < 3; li++) {
    var link = ["vlan", "raw", "sll"][li];
    var c2 = await read(PB.pcap(PB.tcpSession({ client: "10.0.0.5", server: "192.0.2.10", request: req, response: res, link: link }), { link: link }));
    eq("link type " + link, [c2.sessions.length, txt(c2.sessions[0].dirs.toServer.data)], [1, req]);
  }
  var c6 = await read(PB.pcap(PB.tcpSession({ client: "2001:db8::1", server: "2001:db8::2", request: req, response: res, v6: true })));
  eq("IPv6 TCP session", [c6.sessions[0].ipv, c6.sessions[0].client.ip, c6.sessions[0].server.ip, txt(c6.sessions[0].dirs.toServer.data)], [6, "2001:db8::1", "2001:db8::2", req]);
  var cu = await read(PB.pcap([PB.udp({ src: "10.0.0.5", dst: "192.0.2.53", sport: 50000, dport: 53, payload: "query", ts: 1000 }), PB.udp({ src: "192.0.2.53", dst: "10.0.0.5", sport: 53, dport: 50000, payload: "answer", ts: 1001 })]));
  var us = cu.sessions[0];
  eq("UDP session", [us.proto, us.client.port, us.server.port, us.datagrams.map(function (d) { return d.dir; }), txt(us.datagrams[0].data), us.established], ["udp", 50000, 53, ["toServer", "toClient"], "query", true]);
  var cuServerFirst = await read(PB.pcap([PB.udp({ src: "192.0.2.53", dst: "10.0.0.5", sport: 53, dport: 50000, payload: "x", ts: 1000 })]));
  eq("UDP seen only from the low port: that side is the server", [cuServerFirst.sessions[0].server.port, cuServerFirst.sessions[0].datagrams[0].dir], [53, "toClient"]);
  var ci = await read(PB.pcap([{ ts: 1000, frame: PB.frame({ proto: "icmp", src: "10.0.0.5", dst: "192.0.2.1", type: 8, payload: "ping" }) }]));
  eq("ICMP session", [ci.sessions[0].proto, ci.sessions[0].datagrams[0].icmp.type], ["icmp", 8]);
  var frag = PB.frame({ proto: "tcp", src: "10.0.0.5", dst: "192.0.2.10", sport: 1, dport: 2, payload: "x" });
  frag[14 + 6] = 0x00; frag[14 + 7] = 0x10;
  var cf = await read(PB.pcap([{ ts: 1, frame: frag }]));
  eq("non-first IP fragments are skipped", [cf.skipped, cf.sessions.length], [1, 0]);
  var arp = new Uint8Array(60); arp[12] = 0x08; arp[13] = 0x06;
  eq("non-IP frames are skipped", (await read(PB.pcap([{ ts: 1, frame: arp }]))).skipped, 1);

  // ================= TCP reassembly =================
  var long = PB.http("POST", "/up", {}, "0123456789abcdefghijklmnopqrstuvwxyz");
  var split = PB.tcpSession({ client: "10.0.0.5", server: "192.0.2.10", request: long, response: res, split: 9 });
  var dataIdx = split.map(function (p, i) { return i; }).slice(3, 3 + Math.ceil(long.length / 9));
  var shuffled = split.slice(); var seg = dataIdx.map(function (i) { return split[i]; }).reverse();
  dataIdx.forEach(function (i, n) { shuffled[i] = seg[n]; });
  eq("out-of-order segments are put back in order", txt((await read(PB.pcap(shuffled))).sessions[0].dirs.toServer.data), long);
  var withDup = split.slice(); withDup.splice(4, 0, split[4]);
  var capDup = await read(PB.pcap(withDup));
  eq("retransmission is dropped", [txt(capDup.sessions[0].dirs.toServer.data), capDup.sessions[0].dirs.toServer.retransmits], [long, 1]);
  var withGap = split.slice(); withGap.splice(5, 1);
  var capGap = await read(PB.pcap(withGap));
  eq("a missing segment is noted and the stream continues", [capGap.sessions[0].dirs.toServer.gaps, capGap.sessions[0].dirs.toServer.data.length], [1, long.length - 9]);
  var wrap = PB.tcpSession({ client: "10.0.0.5", server: "192.0.2.10", request: long, response: res, split: 9, isn: 4294967290 });
  eq("sequence numbers wrap around 2^32", txt((await read(PB.pcap(wrap))).sessions[0].dirs.toServer.data), long);
  var mid = PB.tcpSession({ client: "10.0.0.5", server: "192.0.2.10", request: req, response: res, noHandshake: true });
  var capMid = await read(PB.pcap(mid));
  eq("capture that starts mid-stream", [capMid.sessions[0].client.port, capMid.sessions[0].server.port, capMid.sessions[0].established], [40000, 80, true]);
  var midServerFirst = PB.tcpSession({ client: "10.0.0.5", server: "192.0.2.10", request: "", response: res, noHandshake: true, noClose: true });
  var capMid2 = await read(PB.pcap(midServerFirst));
  eq("mid-stream, server data first: low port is the server", [capMid2.sessions[0].client.port, capMid2.sessions[0].server.port], [40000, 80]);
  var two = PB.merge(PB.tcpSession({ client: "10.0.0.5", server: "192.0.2.10", cport: 40001, request: req, response: res }), PB.tcpSession({ client: "10.0.0.6", server: "192.0.2.10", cport: 40002, request: req, response: res }));
  eq("two sessions stay separate", (await read(PB.pcap(two))).sessions.length, 2);

  // ================= rule parsing =================
  eq("splitRules joins continuation lines and skips comments", IDS.splitRules("# note\nalert tcp any any -> any any (msg:\"a\"; \\\n content:\"b\"; sid:1;)\n\n  # alert tcp x\nalert udp any any -> any 53 (sid:2;)").length, 2);
  var r1 = IDS.parseRule('alert tcp $EXTERNAL_NET any -> $HOME_NET [80,8080] (msg:"Test; with semicolon"; flow:to_server,established; content:"GET|20|/admin"; nocase; depth:20; offset:2; content:"a\\;b\\"c"; distance:1; within:10; pcre:"/id=\\d+/Ui"; sid:1000001; rev:3; classtype:web-application-attack; priority:2;)', "suricata");
  eq("header fields", [r1.action, r1.proto, r1.src, r1.sport, r1.dir, r1.dst, r1.dport], ["alert", "tcp", "$EXTERNAL_NET", "any", "->", "$HOME_NET", "[80,8080]"]);
  eq("metadata options", [r1.sid, r1.rev, r1.gid, r1.msg, r1.classtype, r1.priority], [1000001, 3, 1, "Test; with semicolon", "web-application-attack", 2]);
  eq("flow parsed", [r1.flow.toServer, r1.flow.toClient, r1.flow.established], [true, false, true]);
  eq("content with hex block and modifiers", [r1.contents[0].str, r1.contents[0].nocase, r1.contents[0].depth, r1.contents[0].offset, r1.contents[0].neg], ["GET /admin", true, 20, 2, false]);
  eq("content with escapes and relative modifiers", [r1.contents[1].str, r1.contents[1].distance, r1.contents[1].within], ["a;b\"c", 1, 10]);
  eq("pcre flags and buffer", [r1.pcres[0].src, r1.pcres[0].flags, r1.pcres[0].buffer, r1.usesHttp], ["id=\\d+", "Ui", "http.uri", true]);
  eq("negated content", IDS.parseRule('alert tcp any any -> any any (content:!"bad"; sid:2;)').contents[0].neg, true);
  eq("hex round trip", IDS.unescapeContent(IDS.escapeContent("A;B|\r\n\"\\")), "A;B|\r\n\"\\");
  eq("escapeContent output", IDS.escapeContent("A;B|\r\n"), "A|3B|B|7C 0D 0A|");
  eq("short Snort 3 service header", IDS.parseRule('alert http (msg:"x"; http_uri; content:"a"; sid:3;)', "snort3").proto, "http");
  var inl = IDS.parseRule('alert tcp any any -> any 80 (http_uri; content:"a,b\\"c", nocase, offset 3, depth 8, fast_pattern; content:"x",distance 1,within 9; sid:12;)', "snort3");
  eq("Snort 3 inline content modifiers", [inl.contents[0].str, inl.contents[0].nocase, inl.contents[0].offset, inl.contents[0].depth, inl.contents[0].fast, inl.contents[1].distance, inl.contents[1].within, inl.contents[0].buffer], ["a,b\"c", true, 3, 8, true, 1, 9, "http.uri"]);
  eq("Snort 3 inline modifiers behave like separate ones", [fires(R('content:"abc", offset 2, depth 3;'), "xxabcxx", "", { engine: "snort3" }), fires(R('content:"abc", offset 2, depth 2;'), "xxabcxx", "", { engine: "snort3" })], [true, false]);
  eq("short header flag", [IDS.parseRule('alert http (content:"a"; sid:1;)').shortHeader, IDS.parseRule('alert tcp any any -> any any (content:"a"; sid:1;)').shortHeader], [true, undefined]);
  eq("startswith and endswith", (function () { var c = IDS.parseRule('alert tcp any any -> any any (content:"a"; startswith; content:"b"; endswith; sid:4;)').contents; return [c[0].startswith, c[1].endswith]; })(), [true, true]);
  eq("fast_pattern flag", IDS.parseRule('alert tcp any any -> any any (content:"abc"; fast_pattern; sid:5;)').contents[0].fast, true);
  eq("variable offsets are noted, not guessed", IDS.parseRule('alert tcp any any -> any any (content:"a"; offset:var1; sid:6;)').contents[0].varMods, ["offset:var1"]);
  var legacy = IDS.parseRule('alert tcp any any -> any 80 (content:"login"; http_uri; content:"x"; nocase; http_header; sid:7;)', "snort2");
  eq("legacy modifier style (Snort 2)", [legacy.contents[0].buffer, legacy.contents[1].buffer, legacy.contents[1].nocase], ["http.uri", "http.header", true]);
  var legacySur = IDS.parseRule('alert tcp any any -> any 80 (content:"login"; http_uri; sid:7;)', "suricata");
  eq("legacy modifier style also reads in Suricata", legacySur.contents[0].buffer, "http.uri");
  var sticky3 = IDS.parseRule('alert tcp any any -> any 80 (http_uri; content:"login"; http_header; content:"x"; sid:8;)', "snort3");
  eq("sticky buffers (Snort 3)", [sticky3.contents[0].buffer, sticky3.contents[1].buffer], ["http.uri", "http.header"]);
  var stickyS = IDS.parseRule('alert http any any -> any any (http.uri; content:"login"; http.header; content:"x"; pkt_data; content:"y"; sid:9;)', "suricata");
  eq("sticky buffers (Suricata) including pkt_data", [stickyS.contents[0].buffer, stickyS.contents[1].buffer, stickyS.contents[2].buffer], ["http.uri", "http.header", "raw"]);
  var uns = IDS.parseRule('alert tcp any any -> any any (content:"a"; byte_test:2,>,5,0; flowbits:isset,x; sid:10;)');
  truthy("options that cannot be simulated are listed", uns.unsupported.indexOf("byte_test") >= 0 && uns.unsupported.indexOf("flowbits") >= 0, JSON.stringify(uns.unsupported));
  eq("threshold option is kept", IDS.parseRule('alert tcp any any -> any any (content:"a"; threshold:type limit, track by_src, count 1, seconds 60; sid:11;)').thresholdOpt.key, "threshold");
  eq("no parentheses is an error", /option list/.test(await throwsMsg(function () { return IDS.parseRule("alert tcp any any -> any any"); })), true);
  eq("unquoted content is an error", /quotes/.test(await throwsMsg(function () { return IDS.parseRule("alert tcp any any -> any any (content:abc; sid:1;)"); })), true);
  eq("bad direction is an error", /direction/.test(await throwsMsg(function () { return IDS.parseRule('alert tcp any any <- any any (content:"a"; sid:1;)'); })), true);
  eq("bad pcre is an error", /pcre/.test(await throwsMsg(function () { return IDS.parseRule('alert tcp any any -> any any (pcre:"abc"; sid:1;)'); })), true);
  eq("parseRules reports a bad rule and keeps the good one", IDS.parseRules('alert tcp any any -> any any (content:"a"; sid:1;)\nnot a rule (x)').map(function (x) { return x.ok; }), [true, false]);

  // ================= search windows (verified against Suricata's inspection code) =================
  eq("absolute window: offset 2 depth 3 finds abc at 2", fires(R('content:"abc"; offset:2; depth:3;'), "xxabcxx"), true);
  eq("depth counts from offset: offset 2 depth 2 is too short", fires(R('content:"abc"; offset:2; depth:2;'), "xxabcxx"), false);
  eq("offset 1 depth 3 window ends before the match ends", fires(R('content:"abc"; offset:1; depth:3;'), "xxabcxx"), false);
  eq("offset 3 starts after the match", fires(R('content:"abc"; offset:3;'), "xxabcxx"), false);
  eq("depth 5 from the start covers it", fires(R('content:"abc"; depth:5;'), "xxabcxx"), true);
  eq("depth 4 does not", fires(R('content:"abc"; depth:4;'), "xxabcxx"), false);
  eq("startswith matches at the start", fires(R('content:"abc"; startswith;'), "abcxx"), true);
  eq("startswith rejects a later match", fires(R('content:"abc"; startswith;'), "xabc"), false);
  eq("endswith matches at the end", fires(R('content:"abc"; endswith;'), "xxabc"), true);
  eq("endswith rejects an earlier match", fires(R('content:"abc"; endswith;'), "abcx"), false);
  eq("case sensitive by default", fires(R('content:"abc";'), "xxABCxx"), false);
  eq("nocase", fires(R('content:"abc"; nocase;'), "xxABCxx"), true);
  eq("relative: distance 4 within 4 covers EF", fires(R('content:"AB"; content:"EF"; distance:4; within:4;'), "ABCDxxxxEF"), true);
  eq("relative: within counts from the start of the distance window", fires(R('content:"AB"; content:"EF"; distance:4; within:2;'), "ABCDxxxxEF"), false);
  eq("relative: distance 6 within 2 is exactly [8,10)", fires(R('content:"AB"; content:"EF"; distance:6; within:2;'), "ABCDxxxxEF"), true);
  eq("relative: distance 7 starts too late", fires(R('content:"AB"; content:"EF"; distance:7; within:3;'), "ABCDxxxxEF"), false);
  eq("within alone counts from the previous match end", fires(R('content:"AB"; content:"EF"; within:8;'), "ABCDxxxxEF"), true);
  eq("within 7 ends one byte early", fires(R('content:"AB"; content:"EF"; within:7;'), "ABCDxxxxEF"), false);
  eq("negative distance looks backwards", fires(R('content:"ABC"; content:"XYZ"; distance:-6; within:6;'), "XYZABC"), true);
  eq("retries earlier matches (backtracking)", fires(R('content:"A"; content:"B"; distance:0; within:3;'), "A----A-B"), true);
  eq("backtracking still fails when no start works", fires(R('content:"A"; content:"B"; distance:0; within:1;'), "A----A-B"), false);
  eq("negated content: absent passes", fires(R('content:"GET"; content:!"admin";'), "GET /home"), true);
  eq("negated content: present blocks", fires(R('content:"GET"; content:!"admin";'), "GET /admin"), false);
  eq("offset raises the start of a relative content", fires(R('content:"A"; content:"B"; distance:0; offset:6;'), "AxxxxxB"), true);
  eq("two contents in order", fires(R('content:"B"; content:"A"; distance:0;'), "ABxxA"), true);
  eq("hex content", fires(R('content:"|0D 0A|X";'), "a\r\nXb"), true);

  // ================= pcre =================
  eq("pcre anchored with ^", fires(R('pcre:"/^GET\\s+\\/[a-z]+/i";'), "get /abc"), true);
  eq("pcre anchor rejects other methods", fires(R('pcre:"/^GET\\s+\\/[a-z]+/i";'), "POST /abc"), false);
  eq("pcre relative flag starts after the previous content", fires(R('content:"id="; pcre:"/^\\d+/R";'), "id=123"), true);
  eq("pcre relative flag rejects non-digits", fires(R('content:"id="; pcre:"/^\\d+/R";'), "id=abc"), false);
  eq("pcre A flag anchors at the start", [fires(R('pcre:"/abc/A";'), "abcx"), fires(R('pcre:"/abc/A";'), "xabc")], [true, false]);
  eq("pcre \\A is translated", [fires(R('pcre:"/\\Aabc/";'), "abcx"), fires(R('pcre:"/\\Aabc/";'), "xabc")], [true, false]);
  eq("pcre escaped backslash before A stays literal", fires(R('pcre:"/\\\\Aabc/";'), "\\Aabc"), true);
  eq("pcre possessive quantifier is accepted", fires(R('pcre:"/a++b/";'), "aaab"), true);
  eq("pcre escaped plus quantified is not changed", fires(R('pcre:"/a\\++b/";'), "a+++b"), true);
  eq("negated pcre", [fires(R('content:"x"; pcre:!"/bad/";'), "x good"), fires(R('content:"x"; pcre:!"/bad/";'), "x bad")], [true, false]);
  var unsupportedP = IDS.parseRule(R('content:"x"; pcre:"/(?<!a)b(*SKIP)c/";'));
  eq("pcre the simulator cannot translate is flagged and skipped", [unsupportedP.pcres[0].unsupported, IDS.run(unsupportedP, [S("xyz")]).approx], [true, ["pcre"]]);

  // ================= dsize, isdataat, flow, header =================
  eq("dsize greater than", fires(R('dsize:>100; content:"a";'), "a".repeat(50)), false);
  eq("dsize range", fires(R('dsize:10<>60; content:"a";'), "a".repeat(50)), true);
  eq("dsize exact", fires(R('dsize:50; content:"a";'), "a".repeat(50)), true);
  eq("isdataat relative within the data", fires(R('content:"a"; isdataat:2,relative;'), "abc"), true);
  eq("isdataat relative past the end", fires(R('content:"a"; isdataat:3,relative;'), "abc"), false);
  eq("isdataat negated absolute", fires(R('content:"a"; isdataat:!3;'), "abc"), true);
  eq("flow to_server fires on client data", fires(R('flow:to_server,established; content:"abc";'), "abc", ""), true);
  eq("flow to_server does not fire on server data", fires(R('flow:to_server,established; content:"abc";'), "", "abc"), false);
  eq("flow to_client fires on server data", fires(R('flow:to_client; content:"abc";'), "", "abc"), true);
  eq("flow established needs a handshake or two-way data", fires(R('flow:established; content:"abc";'), "abc", "", { established: false }), false);
  eq("header: CIDR source and destination", fires(R('content:"a";', "tcp 10.0.0.0/8 any -> 192.0.2.0/24 80"), "a"), true);
  eq("header: negated source", fires(R('content:"a";', "tcp !10.0.0.0/8 any -> any any"), "a"), false);
  eq("header: port list", fires(R('content:"a";', "tcp any any -> any [80,443]"), "a"), true);
  eq("header: port range", [fires(R('content:"a";', "tcp any 1024: -> any any"), "a"), fires(R('content:"a";', "tcp any :1023 -> any any"), "a")], [true, false]);
  eq("header: wrong protocol", fires(R('content:"a";', "udp any any -> any any"), "a"), false);

  eq("F: alert statistics list the noisy source", [anF.alertStats.sources, anF.alertStats.perSource[0].ip, anF.alertStats.perSource[0].count], [1, "10.0.0.9", 5]);
  var ruleF2 = IDS.parseRule('alert tcp any any -> any 4447 (msg:"Ping"; content:"ping"; content:"pong"; sid:7; rev:1;)');
  truthy("F: a fast pattern suggestion appears for multi-content rules", TU.analyze({ rule: IDS.parseRule('alert tcp any any -> any 4447 (msg:"Ping"; content:"ping"; content:"ping-ping"; sid:7; rev:1;)'), engine: "suricata", fp: await read(PB.pcap(PB.merge.apply(null, fpFs))), tp: null }).others.some(function (o) { return o.id === "fast"; }), "");

  // ================= page helpers: compose and the shipped examples =================
  var compA = anA.compose([bufA.id]);
  eq("compose applies chosen changes and measures them", [compA.applied, compA.effect.fpAfter, compA.effect.keepsTp, compA.ruleText.indexOf("http.uri;") > 0], [[bufA.id], 0, true, true]);
  eq("compose with nothing chosen leaves the rule alone", anA.compose([]).effect.fpAfter, 2);
  eq("analysis exposes the alerts for the position table", [anA.fpAlerts.length, anA.tpAlerts.length], [2, 1]);
  for (var exi = 0; exi < SK.idsData.EXAMPLES.length; exi++) {
    var ex = SK.idsData.EXAMPLES[exi], caps = ex.build(PB), cfp = await read(caps.fp), ctp = await read(caps.tp);
    var exAn = TU.analyze({ rule: IDS.parseRule(ex.rule, ex.engine), engine: ex.engine, fp: cfp, tp: ctp, alert: ex.alert ? TU.parseAlert(ex.alert) : null });
    truthy("example " + ex.id + ": fires on both captures and the combined rule fixes it", exAn.fp.alerts > 0 && exAn.tp.alerts > 0 && exAn.combined && exAn.combined.effect.fpAfter === 0 && exAn.combined.effect.keepsTp === true, JSON.stringify(exAn.fp) + JSON.stringify(exAn.tp));
  }

  // ================= MITRE ATT&CK suggestions =================
  function ids(t, o) { return SK.attack.suggest(t, o).map(function (x) { return x.id; }); }
  truthy("attack: PowerShell encoded command", ids("Suspicious powershell -enc download").indexOf("T1059.001") >= 0 && ids("powershell -enc x").indexOf("T1027") >= 0, JSON.stringify(ids("powershell -enc x")));
  truthy("attack: Office spawning a shell", ids("Word spawns cmd.exe from macro").indexOf("T1204.002") >= 0, "");
  truthy("attack: LSASS dump", ids("procdump of lsass.exe")[0] === "T1003.001", JSON.stringify(ids("procdump of lsass.exe")));
  truthy("attack: web scanner or admin probe", ids("EXAMPLE Admin panel probe").indexOf("T1595") >= 0, JSON.stringify(ids("EXAMPLE Admin panel probe")));
  truthy("attack: SQL injection", ids("ET WEB_SERVER SQL Injection UNION SELECT")[0] === "T1190", JSON.stringify(ids("ET WEB_SERVER SQL Injection UNION SELECT")));
  truthy("attack: classtype adds a hint", ids("some rule", { classtype: "network-scan" }).indexOf("T1046") >= 0, "");
  eq("attack: ordinary words do not match (source, security, operate)", ids("source of the security operate separate"), []);
  eq("attack: a sub-technique replaces its parent", ids("powershell").indexOf("T1059"), -1);
  var logs = SK.attack.suggest("wevtutil cl security")[0];
  eq("attack: renumbered ID shows the old one", [logs.id, logs.oldId], ["T1685.005", "T1070.001"]);
  truthy("attack: link goes to attack.mitre.org with sub-technique path", /^https:\/\/attack\.mitre\.org\/techniques\/T1059\/001\/$/.test(SK.attack.suggest("powershell")[0].url), SK.attack.suggest("powershell")[0].url);
  truthy("attack: panel renders text without markup injection", (function () { var el = SK.attackPanel("<img src=x onerror=1> powershell", {}); return el.querySelectorAll("img").length === 0 && /T1059/.test(el.textContent); })(), "");
  truthy("attack: every technique in the table has a name and a tactic", Object.keys(SK.attack.TECH).every(function (k) { return SK.attack.TECH[k].n && SK.attack.TECH[k].t.length; }), "");

  // ================= scenario G: the rule does not fire =================
  var anG = TU.analyze({ rule: IDS.parseRule('alert tcp any any -> any 80 (msg:"x"; content:"zzzqqq"; sid:8;)'), engine: "suricata", fp: fpA, tp: null });
  eq("G: no hit is reported with reasons", [anG.noFpHit, Object.keys(anG.fp.reasons).length > 0], [true, true]);
  eq("G: no recommendations when nothing fired", anG.recs.length, 0);
  var anG2 = TU.analyze({ rule: ruleA, engine: "suricata", fp: fpA, tp: await read(PB.pcap(web("203.0.113.9", 50009, "GET", "/home", {}, undefined, 1700000100000))) });
  truthy("G: a true-positive capture that does not fire is called out", anG2.noTpHit === true && anG2.notes.some(function (n) { return /did not fire on the true-positive/.test(n); }), JSON.stringify(anG2.notes));

  // ================= alert to session =================
  var found = TU.findAlertSessions(fpA.sessions, TU.parseAlert('{"src_ip":"10.0.0.6","src_port":40002,"dest_ip":"192.0.2.10","dest_port":80,"proto":"TCP","alert":{"signature_id":1}}'));
  eq("alert is matched to its session", [found.length, found[0].client.port], [1, 40002]);
  eq("alert matches in reverse direction too", TU.findAlertSessions(fpA.sessions, TU.parseAlert("10/28/2026-12:00:00.000000  [**] [1:1:1] x [**] [Priority: 1] {TCP} 192.0.2.10:80 -> 10.0.0.6:40002")).length, 1);
  eq("unmatched alert finds nothing", TU.findAlertSessions(fpA.sessions, TU.parseAlert("10/28/2026-12:00:00.000000  [**] [1:1:1] x [**] [Priority: 1] {TCP} 1.1.1.1:80 -> 2.2.2.2:1")).length, 0);
  eq("analysis marks the alerted session", TU.analyze({ rule: ruleA, engine: "suricata", fp: fpA, tp: tpA, alert: TU.parseAlert('{"src_ip":"10.0.0.6","src_port":40002,"dest_ip":"192.0.2.10","dest_port":80,"proto":"TCP"}') }).alertSessions.length, 1);
  eq("verification commands exist for each engine", ["suricata", "snort3", "snort2"].map(function (e) { return /capture\.pcap/.test(TU.verifyCommands(e)[0]); }), [true, true, true]);

  document.getElementById("summary").innerHTML = '<span class="' + (failed ? "fail" : "pass") + '">' + passed + " passed, " + failed + " failed</span>";
  document.getElementById("out").innerHTML = lines.join("\n");
  window.__idsDone = { passed: passed, failed: failed };
})().catch(function (e) {
  document.getElementById("summary").innerHTML = '<span class="fail">Test run crashed: ' + e.message + '</span>';
  document.getElementById("out").textContent = e.stack;
  window.__idsDone = { crashed: e.message };
});
</script>
</body>
